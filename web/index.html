<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luca's Amazing Race — Browser Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141b22;font-family:Arial,sans-serif;color:white}
canvas{display:block}#hud{position:fixed;top:16px;left:16px;background:#111a22bb;padding:14px 18px;border-radius:12px;pointer-events:none;line-height:1.6}
#title{font-size:21px;font-weight:bold;color:#ffce45}#speed{font-size:32px;font-weight:bold}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111a22cf;border-radius:10px;padding:9px 14px;text-align:center;font-size:13px;white-space:nowrap}
#msg{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-weight:bold;font-size:24px;text-shadow:2px 2px 3px #000;pointer-events:none;text-align:center}
#failure{display:none;position:fixed;inset:0;background:#111e;color:white;padding:30px}
</style></head><body>
<div id="hud"><div id="title">LUCA'S AMAZING RACE</div><div id="speed">0 km/h</div><div id="info">Race · Lap 1/3 · Health 100%</div><div id="place">Position 1 / 7</div></div>
<div id="msg"></div><div id="help">W/↑ accelerate · S/↓ brake · A/D steer · SPACE handbrake · 1 race · 2 derby · R restart · C camera</div>
<div id="failure">The browser could not start the 3D game. Please enable hardware acceleration / WebGL, or try Chrome on the MacBook.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const fail=document.getElementById('failure');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});}catch(e){fail.style.display='block';throw e;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x94b8ca);scene.fog=new THREE.Fog(0x94b8ca,130,280);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.2,400);
scene.add(new THREE.HemisphereLight(0xfff5e1,0x56704b,2.0));
const sun=new THREE.DirectionalLight(0xffe7b2,2.1);sun.position.set(-40,75,-50);scene.add(sun);
const mat=(color,roughness=0.9)=>new THREE.MeshStandardMaterial({color,roughness,flatShading:false});
const green=mat(0x527744),dirt=mat(0x78634c),inside=mat(0x6b8b4c),stripe=mat(0xc6bd9d);
const black=mat(0x191d20),glass=mat(0x324957,0.34),silver=mat(0x8a979c,0.4);
function box(parent,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o;}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,350),green);ground.rotation.x=-Math.PI/2;ground.position.y=-.07;scene.add(ground);
const N=128,outerA=77,outerB=49,innerA=48,innerB=25,midA=62,midB=37;
function ovalBand(ai,bi,ao,bo,y,m){let v=[],idx=[];for(let i=0;i<=N;i++){let a=i/N*Math.PI*2;v.push(Math.cos(a)*ai,y,Math.sin(a)*bi,Math.cos(a)*ao,y,Math.sin(a)*bo);if(i<N){let j=i*2;idx.push(j,j+1,j+2,j+1,j+3,j+2);}}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();let mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:m,side:THREE.DoubleSide,roughness:1}));scene.add(mesh);}
ovalBand(innerA,innerB,outerA,outerB,.012,0x75604a);
ovalBand(innerA-.6,innerB-.6,innerA+.6,innerB+.6,.023,0xd8c5a2);
ovalBand(outerA-.6,outerB-.6,outerA+.6,outerB+.6,.023,0xe0d0b3);
ovalBand(midA-.12,midB-.12,midA+.12,midB+.12,.025,0xb39a7a);
const island=new THREE.Mesh(new THREE.CircleGeometry(1,64),inside);island.rotation.x=-Math.PI/2;island.scale.set(innerA,innerB,1);island.position.y=.006;scene.add(island);
function barrier(aa,bb,count,col){for(let i=0;i<count;i++){let t=i/count*2*Math.PI;let segment=box(scene,3.2,1.45,.5,aa*Math.cos(t),.72,bb*Math.sin(t),i%2?mat(col):mat(0xeeeeea));segment.rotation.y=-Math.atan2(bb*Math.cos(t),-aa*Math.sin(t));}}
barrier(79,51,116,0xc83d29);
for(let i=0;i<48;i++){let t=i*2*Math.PI/48,x=94*Math.cos(t),z=65*Math.sin(t);box(scene,.65,3,.65,x,1.5,z,mat(0x5a4934));let crown=new THREE.Mesh(new THREE.ConeGeometry(2.5,7,6),mat(0x325d38));crown.position.set(x,6,z);scene.add(crown);}
for(let j=0;j<5;j++){box(scene,31,1.2,4,-29,1.1+j*1.25,-81-j*3,mat(j%2?0x69747a:0xabb2b1));}
box(scene,23,7,13,55,3.5,-77,mat(0x9a9c95));box(scene,25,1.2,15,55,7.5,-77,mat(0x4f5c62));
const keys={};window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Digit1')reset('Race');if(e.code==='Digit2')reset('Derby');if(e.code==='KeyR')reset(mode);if(e.code==='KeyC')cameraMode=(cameraMode+1)%2;});window.addEventListener('keyup',e=>keys[e.code]=false);
function carModel(color){const root=new THREE.Group(),paint=mat(color,.48);
box(root,2.22,.57,4.45,0,.65,0,paint);
box(root,1.85,.65,2.25,0,1.24,.15,glass);
box(root,2.2,.19,1.05,0,.96,-1.62,paint);
box(root,2.22,.15,.3,0,.47,-2.27,silver);
box(root,2.22,.15,.3,0,.47,2.27,silver);
for(let x of [-1.15,1.15])for(let z of [-1.52,1.52]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.51,.51,.3,12),black);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.5,z);root.add(wheel);let hub=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.32,12),silver);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);root.add(hub);}
for(let x of [-.72,.72]){box(root,.47,.18,.05,x,.74,-2.25,mat(0xece8c3));box(root,.45,.18,.05,x,.72,2.24,mat(0xa72f29));}
return root;}
const player={mesh:carModel(0xd83723),x:0,z:0,angle:0,speed:0,health:100,laps:1,progress:0,dead:false};
scene.add(player.mesh);
const rivals=[];const colors=[0x3267b7,0xe9b62d,0x449d78,0xa049b2,0xbcc5c7,0xe46b2c];
for(let i=0;i<6;i++){const car={mesh:carModel(colors[i]),x:0,z:0,angle:0,speed:0,health:100,t:i*.16,laps:1};scene.add(car.mesh);rivals.push(car);}
let mode='Race',cameraMode=0,hitCooldown=0,noticeTime=0;
const hudSpeed=document.getElementById('speed'),hudInfo=document.getElementById('info'),hudPlace=document.getElementById('place'),message=document.getElementById('msg');
function reset(type){mode=type;player.x=0;player.z=midB;player.angle=Math.PI/2;player.speed=0;player.health=100;player.laps=1;player.progress=0;player.dead=false;
for(let i=0;i<rivals.length;i++){let a=Math.PI/2+i*.18,r=rivals[i];r.t=a;r.x=midA*Math.cos(a);r.z=midB*Math.sin(a);r.angle=Math.atan2(-midB*Math.sin(a),midA*Math.cos(a));r.health=100;r.speed=15;r.laps=1;}show(type==='Race'?'RACE START!':'DEMOLITION DERBY!',2);}
function show(text,s){message.textContent=text;noticeTime=s;}
function roadPos(x,z){let rr=Math.sqrt(x*x/(midA*midA)+z*z/(midB*midB));return rr>.78&&rr<1.25;}
function collide(a,b,force=1){let dx=a.x-b.x,dz=a.z-b.z,d=Math.hypot(dx,dz);if(d<3.2&&d>.01){let push=(3.2-d)*.5;a.x+=dx/d*push;b.x-=dx/d*push;a.z+=dz/d*push;b.z-=dz/d*push;
let impact=Math.abs(a.speed-b.speed)*.7+Math.max(Math.abs(a.speed),Math.abs(b.speed))*.27;
if(hitCooldown<=0&&impact>4){let damage=Math.min(24,impact*.55)*force;a.health=Math.max(0,a.health-damage);b.health=Math.max(0,b.health-damage);a.speed*=.48;b.speed*=.62;hitCooldown=.32;if(a===player||b===player)show('CRASH!  -'+Math.round(damage)+' HEALTH',.8);}}}
let last=performance.now();
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000,.045);last=now;hitCooldown=Math.max(0,hitCooldown-dt);noticeTime=Math.max(0,noticeTime-dt);if(noticeTime===0)message.textContent='';
let gas=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),turn=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
if(!player.dead){const accel=roadPos(player.x,player.z)?12:7;player.speed+=gas*accel*dt;player.speed*=Math.pow(gas===0?.976:.991,dt*60);if(keys.Space)player.speed*=Math.pow(.91,dt*60);
player.speed=THREE.MathUtils.clamp(player.speed,-12,31);player.angle-=turn*Math.min(1,Math.abs(player.speed)/10)*1.75*dt*Math.sign(player.speed||1);
player.x+=-Math.sin(player.angle)*player.speed*dt;player.z+=-Math.cos(player.angle)*player.speed*dt;
if(!roadPos(player.x,player.z))player.speed*=Math.pow(.969,dt*60);
if(Math.hypot(player.x,player.z)>132){player.speed=0;player.x=0;player.z=midB;}
let a=Math.atan2(player.z/midB,player.x/midA);if(a<0)a+=Math.PI*2;let p=(a/(Math.PI*2));if(player.progress>.85&&p<.15&&player.speed>3){player.laps++;show('LAP '+player.laps,1.2);}player.progress=p;
if(mode==='Race'&&player.laps>3){show('FINISH! Press R to race again',1000);player.dead=true;}
if(player.health<=0){player.dead=true;show('WRECKED! Press R to restart',1000);}}
for(let i=0;i<rivals.length;i++){let r=rivals[i];if(r.health<=0)continue;
if(mode==='Race'){r.t+=dt*(.21+(i%3)*.015);r.x=midA*Math.cos(r.t)+Math.cos(r.t)*((i%3)-1)*3;r.z=midB*Math.sin(r.t)+Math.sin(r.t)*((i%3)-1)*2;r.angle=Math.atan2(midB*Math.sin(r.t),midA*Math.cos(r.t))+Math.PI/2;r.speed=16+i*.7;}
else{let angle=Math.atan2(player.z-r.z,player.x-r.x);r.angle=-angle-Math.PI/2;r.x+=Math.cos(angle)*11*dt;r.z+=Math.sin(angle)*11*dt;r.speed=11;}
collide(player,r);r.mesh.position.set(r.x,0,r.z);r.mesh.rotation.y=r.angle;}
player.mesh.position.set(player.x,0,player.z);player.mesh.rotation.y=player.angle;
let forward=new THREE.Vector3(-Math.sin(player.angle),0,-Math.cos(player.angle));
let goal=new THREE.Vector3(player.x,0,player.z).addScaledVector(forward,cameraMode===0?-11:-2.1);goal.y=cameraMode===0?6.5:2.7;
camera.position.lerp(goal,Math.min(1,dt*5));camera.lookAt(player.x+forward.x*5,1.15,player.z+forward.z*5);
hudSpeed.textContent=Math.round(Math.abs(player.speed)*3.6)+' km/h';hudInfo.textContent=mode+' · Lap '+Math.min(3,player.laps)+'/3 · Health '+Math.round(player.health)+'%';
let position=1+rivals.filter(r=>r.t/(Math.PI*2)>player.laps-1+player.progress).length;hudPlace.textContent=mode==='Race'?'Position '+position+' / 7':'Cars remaining '+(1+rivals.filter(r=>r.health>0).length);
renderer.render(scene,camera);}
reset('Race');requestAnimationFrame(tick);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
